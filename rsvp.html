<script>
const WEB3FORMS_KEY = '52f478c1-6010-4146-b7fa-a233b25f35ce';

/* BG animations */
const bg = document.getElementById('bgLayer');

[
  [200,60,'12%',28,0],
  [140,44,'35%',22,6],
  [180,55,'58%',32,3],
  [120,38,'78%',19,11],
  [160,50,'92%',25,8]
].forEach(([w,h,top,dur,delay]) => {

  const el = document.createElement('div');
  el.className = 'cloud-bg';

  el.style.cssText = `
    width:${w}px;
    height:${h}px;
    top:${top};
    animation-duration:${dur}s;
    animation-delay:${delay}s;
  `;

  const b1 = document.createElement('div');
  b1.style.cssText = `
    position:absolute;
    width:${h * 1.1}px;
    height:${h * 1.1}px;
    background:inherit;
    border-radius:50%;
    top:-${h * .5}px;
    left:${w * .2}px;
  `;

  const b2 = document.createElement('div');
  b2.style.cssText = `
    position:absolute;
    width:${h * .8}px;
    height:${h * .8}px;
    background:inherit;
    border-radius:50%;
    top:-${h * .35}px;
    left:${w * .45}px;
  `;

  el.appendChild(b1);
  el.appendChild(b2);

  bg.appendChild(el);
});

/* Twinkles */
['⭐','🌟','✨','💫','🌸'].forEach(icon => {

  for(let i = 0; i < 6; i++){

    const s = document.createElement('div');

    s.className = 'star-bg';
    s.textContent = icon;

    s.style.cssText = `
      left:${Math.random()*100}%;
      top:${Math.random()*100}%;
      font-size:${.7 + Math.random()*.9}rem;
      animation-duration:${2 + Math.random()*3}s;
      animation-delay:${Math.random()*4}s;
    `;

    bg.appendChild(s);
  }
});

/* Falling hearts */
['💗','🌸','💕','🩷'].forEach(icon => {

  for(let i = 0; i < 5; i++){

    const h = document.createElement('div');

    h.className = 'heart-fall';
    h.textContent = icon;

    h.style.cssText = `
      left:${Math.random()*100}%;
      font-size:${.9 + Math.random()*.7}rem;
      animation-duration:${8 + Math.random()*10}s;
      animation-delay:${Math.random()*14}s;
    `;

    bg.appendChild(h);
  }
});

/* Toggle RSVP sections */
document.querySelectorAll('input[name="att"]').forEach(radio => {

  radio.addEventListener('change', () => {

    document
      .getElementById('sec-cantmake')
      .classList.toggle('hidden', radio.value !== 'cantmake');

    document
      .getElementById('sec-attending')
      .classList.toggle('hidden', radio.value !== 'attending');

    if(radio.value === 'attending'){
      renderAttendees(qty);
    }
  });
});

/* Guest quantity */
let qty = 1;

document.getElementById('qty-minus').addEventListener('click', () => {

  if(qty > 1){

    qty--;

    document.getElementById('qty-num').textContent = qty;

    renderAttendees(qty);
  }
});

document.getElementById('qty-plus').addEventListener('click', () => {

  if(qty < 20){

    qty++;

    document.getElementById('qty-num').textContent = qty;

    renderAttendees(qty);
  }
});

const TITLES = ['', 'Mr.', 'Mrs.', 'Ms.', 'Dr.', 'Mx.'];

function titleOpts(){

  return TITLES.map(title => `
    <option value="${title}">
      ${title || '—'}
    </option>
  `).join('');
}

/* Render attendee cards */
function renderAttendees(n){

  const container = document.getElementById('att-forms');

  container.innerHTML = '';

  for(let i = 1; i <= n; i++){

    const ord =
      i === 1 ? '1st' :
      i === 2 ? '2nd' :
      i === 3 ? '3rd' :
      `${i}th`;

    const block = document.createElement('div');

    block.className = 'att-block';

    block.style.animationDelay = `${(i - 1) * .1}s`;

    block.innerHTML = `
      <h3>🌸 Guest ${ord}</h3>

      <div class="att-grid">

        <div class="field">
          <label>Title</label>
          <select id="g${i}-title">
            ${titleOpts()}
          </select>
        </div>

        <div class="field">
          <label>First Name *</label>
          <input
            type="text"
            id="g${i}-first"
            placeholder="First name"
          >
        </div>

        <div class="field">
          <label>Last Name *</label>
          <input
            type="text"
            id="g${i}-last"
            placeholder="Last name"
          >
        </div>

      </div>

      <div class="field">
        <label>Email Address *</label>
        <input
          type="email"
          id="g${i}-email"
          placeholder="you@example.com"
        >
      </div>

      <div class="field">
        <label>Address</label>
        <input
          type="text"
          id="g${i}-addr"
          placeholder="Street address, city, state, ZIP"
        >
      </div>
    `;

    container.appendChild(block);
  }
}

renderAttendees(1);

/* Send form */
async function sendForm(
  subject,
  message,
  replyEmail,
  btn,
  msgEl,
  onSuccess
){

  try{

    const controller = new AbortController();

    const timeout = setTimeout(() => {
      controller.abort();
    }, 15000);

    const response = await fetch(
      'https://api.web3forms.com/submit',
      {
        method:'POST',

        headers:{
          'Content-Type':'application/json',
          'Accept':'application/json'
        },

        signal: controller.signal,

        body: JSON.stringify({
          access_key: WEB3FORMS_KEY,
          subject,
          from_name: "Logan & Becky's Baby Shower RSVP",
          replyto: replyEmail,
          message
        })
      }
    );

    clearTimeout(timeout);

    const data = await response.json();

    if(data.success){

      btn.disabled = false;

      onSuccess();

    } else {

      throw new Error(
        data.message || 'Submission failed'
      );
    }

  } catch(error){

    console.error(error);

    showMsg(
      msgEl,
      'error',
      'Oops! Something went wrong. Please try again.'
    );

    btn.disabled = false;

    btn.textContent =
      btn.id === 'btn-cantmake'
      ? '💌 Send My Regrets'
      : '🎀 Send My RSVP!';
  }
}

/* Can't make it */
document
.getElementById('btn-cantmake')
.addEventListener('click', async () => {

  const title =
    document.getElementById('nm-title').value;

  const first =
    document.getElementById('nm-first')
    .value
    .trim();

  const last =
    document.getElementById('nm-last')
    .value
    .trim();

  const email =
    document.getElementById('nm-email')
    .value
    .trim();

  const message =
    document.getElementById('nm-msg')
    .value
    .trim();

  const msgEl =
    document.getElementById('msg-cantmake');

  if(!first || !last || !email){

    showMsg(
      msgEl,
      'error',
      'Please complete all required fields.'
    );

    return;
  }

  const btn =
    document.getElementById('btn-cantmake');

  btn.disabled = true;

  btn.textContent = 'Sending 💌…';

  const body = `
RSVP – Can't Make It
====================

Name:
${title} ${first} ${last}

Email:
${email}

Message:
${message || '(none)'}
`;

  await sendForm(
    'Baby Shower RSVP – Regrets 💌',
    body,
    email,
    btn,
    msgEl,
    () => showSuccess(
      false,
      `${first} ${last}`
    )
  );
});

/* Attending */
document
.getElementById('btn-attending')
.addEventListener('click', async () => {

  const msgEl =
    document.getElementById('msg-attending');

  let valid = true;

  let lines = [
    `RSVP – Attending! (${qty} guest${qty > 1 ? 's' : ''})`,
    '='.repeat(40)
  ];

  for(let i = 1; i <= qty; i++){

    const title =
      document.getElementById(`g${i}-title`).value;

    const first =
      document.getElementById(`g${i}-first`)
      .value
      .trim();

    const last =
      document.getElementById(`g${i}-last`)
      .value
      .trim();

    const email =
      document.getElementById(`g${i}-email`)
      .value
      .trim();

    const addr =
      document.getElementById(`g${i}-addr`)
      .value
      .trim();

    if(!first || !last || !email){

      valid = false;

      break;
    }

    const ord =
      i === 1 ? '1st' :
      i === 2 ? '2nd' :
      i === 3 ? '3rd' :
      `${i}th`;

    lines.push(`
Guest ${ord}

Name:
${title} ${first} ${last}

Email:
${email}

Address:
${addr || '—'}
`);
  }

  if(!valid){

    showMsg(
      msgEl,
      'error',
      'Please fill in all required guest details.'
    );

    return;
  }

  const btn =
    document.getElementById('btn-attending');

  btn.disabled = true;

  btn.textContent = 'Sending 🎀…';

  const g1f =
    document.getElementById('g1-first')
    .value
    .trim();

  const g1l =
    document.getElementById('g1-last')
    .value
    .trim();

  const replyEmail =
    document.getElementById('g1-email')
    .value
    .trim();

  await sendForm(
    'Baby Shower RSVP – Attending! 🎉',
    lines.join('\n'),
    replyEmail,
    btn,
    msgEl,
    () => showSuccess(
      true,
      `${g1f} ${g1l}`,
      qty
    )
  );
});

/* Status messages */
function showMsg(el, type, text){

  el.className =
    'status-msg ' +
    (
      type === 'error'
      ? 'status-error'
      : 'status-success'
    );

  el.textContent = text;
}

/* Success overlay */
function showSuccess(attending, name, count){

  const overlay =
    document.getElementById('successOverlay');

  document.getElementById('successIcon')
  .textContent =
    attending ? '🎉' : '💌';

  document.getElementById('successTitle')
  .textContent =
    attending
    ? 'See you there!'
    : "We'll miss you!";

  document.getElementById('successMsg')
  .textContent =
    attending
    ? `Thank you, ${name}! 🎀 We've received your RSVP for ${count} guest${count > 1 ? 's' : ''}.`
    : `Thank you, ${name}! 💗 Logan & Becky send their love!`;

  overlay.classList.add('show');
}
</script>
